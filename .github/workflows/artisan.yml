name: Run Artisan Command on Hostinger

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Artisan Command to execute'
        required: true
        default: 'migrate:fresh --seed --force'
        type: choice
        options:
          - 'migrate:fresh --seed --force'
          - 'migrate --force'
          - 'db:seed --force'
          - 'optimize:clear'
          - 'config:cache'
          - 'storage:link'

jobs:
  run-artisan:
    runs-on: ubuntu-latest

    steps:
      - name: ⚡ Execute Artisan Command on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ₹{{ secrets.HOSTINGER_SSH_HOST || '82.25.107.63' }}
          username: ₹{{ secrets.HOSTINGER_SSH_USER || 'u604295259' }}
          password: ₹{{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ₹{{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script: |
            cd ₹{{ secrets.HOSTINGER_REMOTE_PATH || 'public_html/' }}
            echo "Running: php artisan ₹{{ github.event.inputs.command }}"
            php artisan ₹{{ github.event.inputs.command }}
