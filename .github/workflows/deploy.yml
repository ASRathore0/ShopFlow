name: Deploy ShopFlow to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

# Ensure only one deployment runs at a time
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # STEP 1: BUILD FRONTEND (Runs on GitHub, NOT Hostinger)
      # ----------------------------------------------------
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies & Build
        working-directory: frontend
        env:
          VITE_API_URL: ₹{{ secrets.VITE_API_URL || '/api' }}
        run: |
          npm install
          npm run build

      # ----------------------------------------------------
      # STEP 2: BUILD BACKEND (PHP & Composer dependencies)
      # ----------------------------------------------------
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, curl
          coverage: none

      - name: 📦 Install Composer Dependencies (Production only)
        working-directory: backend
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --quiet

      # ----------------------------------------------------
      # STEP 3: UNIFY FRONTEND ASSETS INTO LARAVEL PUBLIC
      # (This lets Hostinger serve both Frontend & API from 1 domain with 0 CORS issues)
      # ----------------------------------------------------
      - name: 🔗 Copy Frontend Build to Laravel Public Directory
        run: |
          mkdir -p backend/public/dist
          cp -r frontend/dist/* backend/public/

      # ----------------------------------------------------
      # STEP 4: DEPLOY TO HOSTINGER VIA RSYNC OVER SSH
      # Uses Hostinger SSH Password directly (no key generation needed!)
      # ----------------------------------------------------
      - name: 🚀 Deploy to Hostinger via Rsync
        env:
          SSH_PASS: ₹{{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_HOST: ₹{{ secrets.HOSTINGER_SSH_HOST || '82.25.107.63' }}
          SSH_USER: ₹{{ secrets.HOSTINGER_SSH_USER || 'u604295259' }}
          SSH_PORT: ₹{{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          REMOTE_DIR: ₹{{ secrets.HOSTINGER_REMOTE_PATH || 'public_html/' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="₹SSH_PASS"
          sshpass -e rsync -rlgoDzvc -i --delete \
            -e "ssh -p ₹SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude='/.git/' \
            --exclude='/.env' \
            --exclude='/node_modules/' \
            --exclude='/.github/' \
            --exclude='/frontend/' \
            --exclude='/storage/logs/*' \
            --exclude='/storage/framework/sessions/*' \
            backend/ ₹SSH_USER@₹SSH_HOST:₹REMOTE_DIR

      # ----------------------------------------------------
      # STEP 5: RUN POST-DEPLOY MIGRATIONS & CACHE ON HOSTINGER
      # ----------------------------------------------------
      - name: ⚡ Run Post-Deployment Artisan Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ₹{{ secrets.HOSTINGER_SSH_HOST || '82.25.107.63' }}
          username: ₹{{ secrets.HOSTINGER_SSH_USER || 'u604295259' }}
          password: ₹{{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ₹{{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script: |
            cd ₹{{ secrets.HOSTINGER_REMOTE_PATH || 'public_html/' }}
            if [ ! -f .env ]; then
              cp .env.production.example .env
              php artisan key:generate --force
            fi
            php artisan migrate --force --no-interaction
            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache


