name: Deploy ShopFlow to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

# Ensure only one deployment runs at a time
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # STEP 1: BUILD FRONTEND (Runs on GitHub, NOT Hostinger)
      # ----------------------------------------------------
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies & Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api' }}
        run: |
          npm install
          npm run build

      # ----------------------------------------------------
      # STEP 2: BUILD BACKEND (PHP & Composer dependencies)
      # ----------------------------------------------------
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, curl
          coverage: none

      - name: 📦 Install Composer Dependencies (Production only)
        working-directory: backend
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --quiet

      # ----------------------------------------------------
      # STEP 3: UNIFY FRONTEND ASSETS INTO LARAVEL PUBLIC
      # (This lets Hostinger serve both Frontend & API from 1 domain with 0 CORS issues)
      # ----------------------------------------------------
      - name: 🔗 Copy Frontend Build to Laravel Public Directory
        run: |
          mkdir -p backend/public/dist
          cp -r frontend/dist/* backend/public/

      # ----------------------------------------------------
      # STEP 4: DEPLOY TO HOSTINGER VIA RSYNC OVER SSH
      # (With auto-detection & fallback to FTPS if SSH port is blocked or times out)
      # ----------------------------------------------------
      - name: 🚀 Deploy to Hostinger via Rsync
        id: rsync_deploy
        continue-on-error: true
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST || '82.25.107.63' }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER || 'u604295259' }}
          RAW_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          REMOTE_DIR: ${{ secrets.HOSTINGER_REMOTE_PATH || 'public_html/' }}
        run: |
          # Sanitize port: Hostinger uses 65002. Port 22 is disabled on Hostinger.
          SSH_PORT="65002"
          if [ -n "$RAW_PORT" ] && [ "$RAW_PORT" != "22" ]; then
            SSH_PORT="$RAW_PORT"
          fi

          echo "Target Hostinger Server: $SSH_HOST:$SSH_PORT (User: $SSH_USER)"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$SSH_PASS"

          # Quick connection test with 10s timeout to avoid 3-minute hangs
          if ! sshpass -e ssh -p $SSH_PORT -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -q $SSH_USER@$SSH_HOST "exit 0" 2>/dev/null; then
            echo "::warning::SSH connection to $SSH_HOST:$SSH_PORT timed out. Hostinger SSH Access may be Disabled or blocking GitHub runner IP."
            echo "Proceeding with automatic FTPS fallback deployment..."
            exit 1
          fi

          echo "SSH connection verified! Syncing files via Rsync..."
          sshpass -e rsync -rlgoDzvc -i --delete \
            -e "ssh -p $SSH_PORT -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude='/.git/' \
            --exclude='/.env*' \
            --exclude='/node_modules/' \
            --exclude='/.github/' \
            --exclude='/frontend/' \
            --exclude='/uploads/***' \
            --exclude='/public/uploads/***' \
            --exclude='/storage/app/***' \
            --exclude='/storage/logs/*' \
            --exclude='/storage/framework/sessions/*' \
            --exclude='/storage/framework/cache/*' \
            --exclude='/storage/framework/views/*' \
            --exclude='/database/*.sqlite*' \
            backend/ $SSH_USER@$SSH_HOST:$REMOTE_DIR

      # ----------------------------------------------------
      # STEP 4B: FALLBACK TO SECURE FTPS (If SSH timed out or failed)
      # Hostinger FTP is always enabled on port 21
      # ----------------------------------------------------
      - name: 🚀 Fallback: Deploy to Hostinger via Secure FTPS
        if: steps.rsync_deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_SSH_HOST || '82.25.107.63' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u604295259' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          server-dir: ${{ secrets.HOSTINGER_REMOTE_PATH || 'public_html/' }}
          local-dir: ./backend/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/frontend/**
            **/.env*
            **/uploads/**
            **/public/uploads/**
            **/storage/app/**
            **/storage/logs/*
            **/storage/framework/sessions/*
            **/*.sqlite*

      # ----------------------------------------------------
      # STEP 5: RUN POST-DEPLOY MIGRATIONS & CACHE ON HOSTINGER
      # ----------------------------------------------------
      - name: ⚡ Run Post-Deployment Artisan Commands
        if: steps.rsync_deploy.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '82.25.107.63' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u604295259' }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: 65002
          timeout: 25s
          script: |
            cd ${{ secrets.HOSTINGER_REMOTE_PATH || 'public_html/' }}
            if [ ! -f .env ]; then
              cp .env.production.example .env
              php artisan key:generate --force
            fi
            # Ensure upload directories exist and have proper public read permissions (755)
            mkdir -p public/uploads/products public/uploads/logos public/uploads/avatars
            chmod -R 755 public/uploads
            # Run non-destructive migrations only (never wipes or drops tables)
            php artisan migrate --force --no-interaction
            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
